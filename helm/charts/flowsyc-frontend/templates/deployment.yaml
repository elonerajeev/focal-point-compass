apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowsyc-frontend.fullname" . }}
  labels: {{ include "flowsyc-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flowsyc-frontend.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{ include "flowsyc-frontend.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: frontend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
{{- range $key, $val := .Values.env }}
        - name: {{ $key }}
          value: {{ $val | quote }}
{{- end }}
        resources: {{ toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probe.path }}
            port: {{ .Values.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: {{ .Values.probe.path }}
            port: {{ .Values.service.port }}
          initialDelaySeconds: 3
          periodSeconds: 5
