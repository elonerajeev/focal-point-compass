{{- $ns := .Values.namespace.name | default (printf "tenant-%s" .Values.orgId) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scan-executor
  namespace: {{ $ns }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["scan-secrets"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scan-executor-binding
  namespace: {{ $ns }}
subjects:
- kind: ServiceAccount
  name: scan-sa
  namespace: {{ $ns }}
roleRef:
  kind: Role
  name: scan-executor
  apiGroup: rbac.authorization.k8s.io
