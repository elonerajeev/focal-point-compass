{{- $ns := .Values.namespace.name | default (printf "tenant-%s" .Values.orgId) -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
{{- if .Values.networkPolicy.egress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-essential
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  {{- if .Values.networkPolicy.egress.allowDB }}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 5432
      protocol: TCP
  {{- end }}
  {{- if .Values.networkPolicy.egress.allowQueue }}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 5671
      protocol: TCP
    - port: 5672
      protocol: TCP
  {{- end }}
  - to:
    - namespaceSelector: {}
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  {{- if .Values.networkPolicy.egress.allowKeyVault }}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 443
      protocol: TCP
  {{- end }}
{{- end -}}
