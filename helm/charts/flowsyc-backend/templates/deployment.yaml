apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowsyc-backend.fullname" . }}
  labels: {{ include "flowsyc-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flowsyc-backend.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{ include "flowsyc-backend.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/health"
    spec:
      serviceAccountName: {{ include "flowsyc-backend.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: backend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
{{- range $key, $val := .Values.env }}
{{- if kindIs "map" $val }}
        - name: {{ $key }}
{{ toYaml $val | nindent 10 }}
{{- else }}
        - name: {{ $key }}
          value: {{ $val | quote }}
{{- end }}
{{- end }}
        resources: {{ toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probe.path }}
            port: {{ .Values.service.port }}
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: {{ .Values.probe.path }}
            port: {{ .Values.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
